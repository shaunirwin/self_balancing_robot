[env:esp32-s3-devkitc-1]
; [env:freenove_esp32_s3_wroom]   ; https://docs.platformio.org/en/latest/boards/espressif32/freenove_esp32_s3_wroom.html#board-espressif32-freenove-esp32-s3-wroom
platform = espressif32 @ 6.10.0
board = esp32-s3-devkitc-1 ;freenove_esp32_s3_wroom
framework = arduino
lib_deps =
    me-no-dev/AsyncTCP@^1.1.1

; build_flags =
;    -DARDUINO_USB_MODE=1
;    -DARDUINO_USB_CDC_ON_BOOT=1

;/dev/ttyCH343USB0
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 115200
; monitor_rts = 0
; monitor_dtr = 0
