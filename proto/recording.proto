syntax = "proto3";

package sbr.recording;

// SBRPB1 file: eight bytes "SBRPB1\0\0", then a varint-length-delimited
// RecordingHeader, followed by varint-length-delimited RecordingBatch messages.
// Batches are ordered, contiguous, and together contain record_count samples.
message RecordingHeader {
  uint32 format_version = 1; // Must be 1 for SBRPB1.
  uint32 sample_rate_hz = 2; // Nominal rate; use sample elapsed_us for timing.
  uint32 record_count = 3;
  uint32 capacity = 4;
  float pid_kp = 5;
  float pid_ki = 6;
  float pid_kd = 7;
  float pitch_setpoint_rad = 8;
  float pitch_error_min_rad = 9;
  float pitch_error_max_rad = 10;
  uint32 duty_cycle_min = 11;
  uint32 duty_cycle_max = 12;
  RecordingSettings settings_at_start = 13; // Absent in older SBRPB1 files.
  string firmware_revision = 14; // Build Git revision, or "unknown".
  bool settings_changed_during_recording = 15;
}

// Values captured when the control task processes Start. SI units unless noted.
message RecordingSettings {
  float pid_kp = 1;
  float pid_ki = 2;
  float pid_kd = 3;
  float pid_output_min = 4;
  float pid_output_max = 5;
  float pid_integral_threshold = 6;
  float pitch_setpoint_rad = 7;
  float pitch_error_min_rad = 8;
  float pitch_error_max_rad = 9;
  float auto_arm_max_pitch_error_rad = 10;
  float complementary_filter_gyro_weight = 11;
  uint32 duty_cycle_min = 12;
  uint32 duty_cycle_max = 13;
  float motor1_speed_slope = 14; // Motor calibration: speed per PWM count.
  float motor1_speed_intercept = 15; // Motor calibration: speed at zero PWM.
  float motor2_speed_slope = 16;
  float motor2_speed_intercept = 17;
  bool motor1_direction_inverted = 18;
  bool motor2_direction_inverted = 19;
  bool motor_coast = 20;
  uint32 pwm_frequency_hz = 21;
  uint32 pwm_resolution_bits = 22;
  float wheel_diameter_m = 23;
  uint32 encoder_pulses_per_revolution = 24;
  bool imu_calibration_valid = 25;
  float imu_gyro_y_offset_rad_s = 26;
  float imu_pitch_accel_offset_rad = 27;
}

message RecordingBatch {
  uint32 first_index = 1; // Zero-based index of samples[0].
  repeated RecordingSample samples = 2; // At most 16 in SBRPB1.
}

message RecordingSample {
  enum ControlMode {
    AUTO = 0;
    MANUAL = 1;
    FUNCTION = 2;
  }

  uint32 elapsed_us = 1; // Monotonic time since recording start.
  float pitch_rad = 2;
  float gyro_rad_s = 3;
  float pid_output = 4;
  sint32 motor1_encoder_pulses = 5;
  sint32 motor2_encoder_pulses = 6;
  uint32 control_interval_us = 7;
  uint32 motor1_pwm = 8;
  uint32 motor2_pwm = 9;
  bool motor1_dir_pin = 10;
  bool motor2_dir_pin = 11;
  ControlMode mode = 12;
  bool estimates_valid = 13;
  bool motor1_forward_command = 14;
  bool motor2_forward_command = 15;
}
